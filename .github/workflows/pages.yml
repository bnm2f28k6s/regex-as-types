name: Check and publish documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Download pinned Docgen
        env:
          DOCGEN_SHA256: bd8b0342fadd19ec0959edafb19c18633349d55d45b4b890772c6ec9d74f4096
        run: |
          curl --fail --location --silent --show-error --retry 3 \
            https://github.com/thecodrr/docgen/releases/download/0.3.3/docgen-0.3.3-x86_64-unknown-linux-musl.tar.gz \
            -o "$RUNNER_TEMP/docgen.tar.gz"
          printf '%s  %s\n' "$DOCGEN_SHA256" "$RUNNER_TEMP/docgen.tar.gz" | sha256sum --check --strict
          mkdir -p bin
          tar -xzf "$RUNNER_TEMP/docgen.tar.gz" -C bin --strip-components=1 \
            docgen-0.3.3-x86_64-unknown-linux-musl/docgen
          ./bin/docgen --version
      - name: Test checker and installer shell syntax
        run: |
          sh -n scripts/install-docgen.sh
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -v
      - name: Build documentation
        run: ./bin/docgen build --release
      - name: Check rendered site and repository hygiene
        run: |
          python3 scripts/check-site.py
          git check-ignore bin/docgen site/index.html
          git diff --check
          git diff --cached --check
          git diff --check HEAD^ HEAD
      - name: Upload site only
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site/

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
